{
    "$schema": "https://render.com/schema/render.yaml.json",
    "services": [
        {
            "type": "web",
            "name": "savecircle",
            "runtime": "node",
            "plan": "free",
            "region": "frankfurt",
            "branch": "main",
            "autoDeployTrigger": "commit",
            "buildCommand": "ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --include=dev && npm run build",
            "startCommand": "npm start",
            "healthCheckPath": "/api/health",
            "envVars": [
                {
                    "key": "NODE_ENV",
                    "value": "production"
                },
                {
                    "key": "HOST",
                    "value": "0.0.0.0"
                },
                {
                    "key": "ELECTRON_SKIP_BINARY_DOWNLOAD",
                    "value": "1"
                },
                {
                    "key": "DATABASE_URL",
                    "sync": false
                },
                {
                    "key": "JWT_SECRET",
                    "sync": false
                },
                {
                    "key": "CORS_ORIGIN",
                    "sync": false
                }
            ]
        }
    ]
}
